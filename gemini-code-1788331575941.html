<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命定機甲診斷 - Suit Change 系統測試</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(20, 27, 45, 0.85);
      --accent-color: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.4);
      --text-color: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.08) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow);
      border-radius: 12px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    .hidden { display: none !important; }

    /* Home Screen */
    .title {
      font-size: 2rem;
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .intro-text {
      line-height: 1.6;
      margin-bottom: 25px;
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    /* Question Screen */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent-color);
    }

    .question-title {
      font-size: 1.25rem;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--text-color);
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .btn:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-start {
      display: block;
      width: 100%;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Result Screen */
    .result-card img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      margin-bottom: 20px;
    }

    .result-name {
      font-size: 1.8rem;
      color: var(--accent-color);
      margin-bottom: 5px;
    }

    .result-quote {
      font-style: italic;
      color: #ffd700;
      margin-bottom: 15px;
      font-size: 1.05rem;
    }

    .result-desc {
      line-height: 1.6;
      color: var(--text-dim);
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 開始畫面 -->
    <div id="screen-start">
      <h1 class="title">Suit Change 命定機甲診斷</h1>
      <p class="intro-text">
        距離正式上市的日子越來越近了！在踏入戰場前，身為守護者的你，必須先了解作戰核心——「Suit Change機甲輪切系統」。<br><br>
        回答 4 道戰術決策題目，測出最契合你戰鬥風格的命定機甲！
      </p>
      <button class="btn btn-start" onclick="startQuiz()">開啟同步率連結</button>
    </div>

    <!-- 2. 測驗題目畫面 -->
    <div id="screen-quiz" class="hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <h2 class="question-title" id="question-text">題目載入中...</h2>
      <div class="options" id="options-container"></div>
    </div>

    <!-- 3. 測驗結果畫面 -->
    <div id="screen-result" class="hidden">
      <h1 class="title" style="font-size: 1.4rem;">你的命定核心機甲</h1>
      <div class="result-card">
        <img id="result-img" src="" alt="機甲圖片">
        <h2 class="result-name" id="result-name"></h2>
        <p class="result-quote" id="result-quote"></p>
        <p class="result-desc" id="result-desc"></p>
      </div>
      <button class="btn btn-start" onclick="restartQuiz()">重新進行同步測試</button>
    </div>
  </div>

  <script>
    // 機甲資料 (所有圖片檔名已改為 .png)
    const mechas = {
      warlord: {
        name: "戰士 (Warlord) — 穩固戰局的鋼鐵要塞",
        quote: "「以沉重且具威壓的攻擊壓制敵人，必定引導戰場的生力。」",
        desc: "特色：身披裝甲線條剛硬的重型合金機甲，戰士擁有無懈可擊的戰場壓迫感。手持巨錘與大盾，不僅能穩穩扛下敵方 Boss 的致命打擊，更能抓準時機進行防禦反擊（Counter），是粉碎敵方霸體、主導戰場節奏的核心鐵壁。",
        image: "戰士.png"
      },
      hunter: {
        name: "獵人 (Hunter) — 戰場上的暴風刺客",
        quote: "「深入敵陣中心，施展如暴風般猛烈的技能，瞬間殲滅敵人。」",
        desc: "特色：獵人穿戴流線型的輕量化科技外骨骼，是戰場上不可捉摸的幻影。擅長使用雙劍與步槍進行超高速的近戰斬擊與遠程精準牽制。對於追求極致攻速、敏捷走位與高頻率輸出的守護者來說，這是絕對的首選配置。",
        image: "獵人.png"
      },
      warlock: {
        name: "術士 (Warlock) — 破壞性的元素主宰",
        quote: "「基於堅強的意志施展破壞性的咒語，將阻擋在前的所有障礙物粉碎。」",
        desc: "特色：術士將未來科幻技術與強大的元素能量完美融合。操控著浮游的能量飄帶，能引導毀滅性的能量風暴與大範圍落雷。擁有視覺張力強大的魔杖與魔劍，專門對大範圍敵軍進行屬性爆發與狂暴洗場。",
        image: "術士.png"
      },
      engineer: {
        name: "工程師 (Engineer) — 精準控場的重砲專家",
        quote: "「利用各種先進技術使敵人無力化，並在任何惡劣條件下控制局勢。」",
        desc: "特色：充滿硬核工業風與重火器機械結構。工程師雙臂配備沉重的機械護手與重砲，除了能在近距離進行充滿打擊感的痛擊，更能隨時召喚高科技浮游砲與導彈發射器進行全方位地毯式轟炸，在任何極端惡劣的戰況下都能強行控場。",
        image: "工程師.png"
      }
    };

    // 題目資料
    const questions = [
      {
        question: "1. 進入未知區域時發現巨大 Boss，你的第一反應是？",
        options: [
          { text: "舉起大盾頂在最前線，隨時準備架防反擊", type: "warlord" },
          { text: "利用高移動速度快速繞後，尋找弱點切入", type: "hunter" },
          { text: "拉開安全距離，開始吟唱高傷害的大範圍毀滅技能", type: "warlock" },
          { text: "架設自動火力與浮游砲，部署火力網控制局勢", type: "engineer" }
        ]
      },
      {
        question: "2. 在隊伍作戰中，你最渴望扮演的角色是？",
        options: [
          { text: "擋下致命傷害、穩固戰局的核心隊長", type: "warlord" },
          { text: "極速高頻輸出、穿梭敵陣的致命刺客", type: "hunter" },
          { text: "掌握元素力量、一招清場的爆發主理人", type: "warlock" },
          { text: "提供重火力壓制、全面封鎖敵人行動的控場專家", type: "engineer" }
        ]
      },
      {
        question: "3. 你偏好的武器設計風格是？",
        options: [
          { text: "厚重感十足的合金巨錘與鐵壁大盾", type: "warlord" },
          { text: "靈巧迅捷的雙劍與輕型步槍", type: "hunter" },
          { text: "充滿未來科幻感的魔法杖與能量魔劍", type: "warlock" },
          { text: "硬核工業風的沉重機械護手與重砲導彈", type: "engineer" }
        ]
      },
      {
        question: "4. 面對最惡劣、數量龐大的敵軍包圍時，你的應對方式是？",
        options: [
          { text: "硬撼敵軍霸體，靠實打實的反擊將敵人粉碎", type: "warlord" },
          { text: "施展暴風般的連擊迅速將敵人群斬殲滅", type: "hunter" },
          { text: "引導毀滅性的雷暴與能量風暴進行狂暴洗場", type: "warlock" },
          { text: "召喚浮游砲與導彈進行地毯式轟炸強行控場", type: "engineer" }
        ]
      }
    ];

    let currentQuestion = 0;
    let scores = { warlord: 0, hunter: 0, warlock: 0, engineer: 0 };

    function startQuiz() {
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-quiz').classList.remove('hidden');
      currentQuestion = 0;
      scores = { warlord: 0, hunter: 0, warlock: 0, engineer: 0 };
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-text').innerText = q.question;
      
      // 更新進度條
      const progressPercent = ((currentQuestion) / questions.length) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(type) {
      scores[type]++;
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('screen-quiz').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');

      // 找出得分最高的機甲
      let bestMatch = 'warlord';
      let maxScore = -1;
      for (const [key, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          bestMatch = key;
        }
      }

      const resultData = mechas[bestMatch];
      document.getElementById('result-name').innerText = resultData.name;
      document.getElementById('result-quote').innerText = resultData.quote;
      document.getElementById('result-desc').innerText = resultData.desc;
      document.getElementById('result-img').src = resultData.image;
    }

    function restartQuiz() {
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-start').classList.remove('hidden');
    }
  </script>
</body>
</html>
